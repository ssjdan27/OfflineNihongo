<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OfflineNihongo</title>
    <script>
      // Apply the saved theme before the first paint, so dark mode doesn't
      // start with a light flash while the app loads.
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <style>
      /* First-frame colors until the app's stylesheet has loaded */
      html { background-color: #ffffff; }
      html.dark { background-color: #1a1a1a; color-scheme: dark; }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
